name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build_backend:
    name: Build backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install backend dependencies and build
        working-directory: backend
        run: |
          npm ci
          npm run build

  build_frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  backend_testing:
    name: Backend unit testing
    runs-on: ubuntu-latest
    needs: build_backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend unit tests
        working-directory: backend
        run: npm run test

  functional_testing:
    name: Functional tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build_backend, build_frontend]
    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Type-check test scripts
        working-directory: e2e
        run: npm run typecheck

      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Build backend and frontend for the tests
        working-directory: e2e
        run: npm run build:app

      - name: Run functional tests
        working-directory: e2e
        run: npm test

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/results/
            e2e/test-results/
          retention-days: 14

  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [build_frontend, backend_testing]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=mtoplak
            -Dsonar.projectKey=mtoplak_CareerCompass
            -Dsonar.qualitygate.wait=false
